name: Deploy Backend to Azure (CD)

on:
  push:
    branches: [main]
    paths:
      - 'online-classroom-backend/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch: # Cho phép chạy thủ công trên GitHub UI

env:
  IMAGE_NAME: onlineclassroomacr.azurecr.io/online-classroom-backend

jobs:
  # =========================================================================
  # Build Docker image và push lên Azure Container Registry (ACR)
  # =========================================================================
  build-and-push:
    name: Build & Push Docker Image to ACR
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Log in to Azure Container Registry (ACR)
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract Docker Metadata (tags & labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./online-classroom-backend
          file: ./online-classroom-backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max # Cache layer để build nhanh hơn lần sau

  # =========================================================================
  # Deploy image mới lên Azure App Service
  # =========================================================================
  deploy-to-azure:
    name: Deploy to Azure App Service
    runs-on: ubuntu-latest
    needs: build-and-push # Chờ build xong mới deploy
    environment:
      name: production

    steps:
      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy Container to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
          images: ${{ env.IMAGE_NAME }}:latest

      - name: Log out from Azure
        if: always()
        run: az logout
