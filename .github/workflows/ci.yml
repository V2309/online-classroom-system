name: Continuous Integration (CI)

on:
  push:
    branches: [ main, master, develop ]
    paths:
      - 'online-classroom-backend/**'
      - 'online-classroom-ui/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [ main, master, develop ]
    paths:
      - 'online-classroom-backend/**'
      - 'online-classroom-ui/**'
      - '.github/workflows/ci.yml'
  workflow_dispatch: # Cho phép bấm chạy thủ công trên GitHub UI

jobs:
  # =========================================================================
  # 1. Job kiểm tra những phần code nào đã thay đổi (Path Filtering)
  # =========================================================================
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      ui: ${{ steps.filter.outputs.ui }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Filter Changed Paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'online-classroom-backend/**'
              - '.github/workflows/ci.yml'
            ui:
              - 'online-classroom-ui/**'
              - '.github/workflows/ci.yml'

  # =========================================================================
  # 2. Job CI cho Backend (NestJS + Prisma)
  # =========================================================================
  backend-ci:
    name: Backend CI (NestJS)
    needs: changes
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./online-classroom-backend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: online-classroom-backend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run ESLint
        run: npm run lint

      - name: Build Backend (NestJS)
        run: npm run build

      - name: Run Unit Tests
        run: npm test -- --passWithNoTests

  # =========================================================================
  # 3. Job CI cho Frontend (Next.js)
  # =========================================================================
  frontend-ci:
    name: Frontend CI (Next.js)
    needs: changes
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.ui == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./online-classroom-ui

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: online-classroom-ui/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Build Frontend (Next.js)
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8080/api
          NEXT_PUBLIC_BASE_URL: http://localhost:3000
          JWT_SECRET_KEY: ci_build_secret_key_testing_12345
          NEXT_PUBLIC_IMAGEKIT_PUBLIC_KEY: public_mock_key
          NEXT_PUBLIC_IMAGEKIT_URL_ENDPOINT: https://ik.imagekit.io/mock
          NEXT_PUBLIC_STREAM_API_KEY: mock_stream_api_key
          NEXT_PUBLIC_PUSHER_KEY: mock_pusher_key
          NEXT_PUBLIC_PUSHER_CLUSTER: ap1
        run: npm run build
